[package]
name = "dbengine"
version = "0.1.0"
edition = "2021"
default-run = "dbengine"

[dependencies]
thiserror = "1"
rustyline = "14"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
argon2 = { version = "0.5", default-features = false, features = ["std", "alloc", "password-hash"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
