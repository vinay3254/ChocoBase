version: '3.8'

services:
  chocobase:
    build:
      context: .
      dockerfile: Dockerfile
    image: vinay3254/chocobase:latest
    container_name: chocobase
    restart: unless-stopped
    ports:
      - "8080:8080"  # HTTP REST, Realtime WS, Storage, Studio Dashboard
      - "5433:5433"  # PostgreSQL Wire Protocol
    volumes:
      - chocobase_data:/data
    environment:
      - RUST_LOG=info
      - CHOCOBASE_DATA_DIR=/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  chocobase_data:
    driver: local
